name: Build StitchLabOS Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DIST_NAME: StitchLabOS

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build SKR Pico firmware (Katapult + Klipper)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3

          FW_OUT="$GITHUB_WORKSPACE/stitchlabos/image/src/modules/pico-firmware/filesystem/home/pi/firmware"
          mkdir -p "$FW_OUT"

          # A silently-renamed upstream Kconfig symbol would produce firmware that
          # builds fine and then cannot talk to the Pi. Fail loudly instead:
          # every non-comment line of the seed must survive olddefconfig.
          assert_config() {
            local generated="$1" seed="$2" line
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              if ! grep -qxF "$line" "$generated"; then
                echo "::error::'$line' did not survive olddefconfig ($seed)."
                echo "Upstream Kconfig symbols changed. Resulting config was:"
                grep -E 'MACH_|FLASH_START|SERIAL|BAUD' "$generated" || true
                exit 1
              fi
            done < "$seed"
          }

          build_fw() {
            local repo="$1" dir="$2" seed="$3"
            git clone --depth=1 "$repo" "$dir"
            cp "firmware/skr-pico/${seed}" "$dir/.config"
            make -C "$dir" olddefconfig
            assert_config "$dir/.config" "firmware/skr-pico/${seed}"
            make -C "$dir" -j"$(nproc)"
          }

          # Katapult first: it owns 0x10000100 and hands over at 0x10004000.
          build_fw https://github.com/Arksine/katapult.git katapult-build katapult.config
          cp katapult-build/out/katapult.uf2 "$FW_OUT/"

          # Klipper for the Katapult layout — flashed over /dev/serial0.
          build_fw https://github.com/Klipper3d/klipper.git klipper-build klipper.config
          # With a bootloader offset Klipper's rp2040 Makefile builds only
          # klipper.bin; the uf2 rule exists but is not a default target.
          make -C klipper-build out/klipper.uf2
          cp klipper-build/out/klipper.bin "$FW_OUT/"
          cp klipper-build/out/klipper.uf2 "$FW_OUT/"
          echo "KLIPPER_FW_SHA=$(git -C klipper-build rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "KATAPULT_FW_SHA=$(git -C katapult-build rev-parse --short HEAD)" >> "$GITHUB_ENV"

          # Recovery build without a bootloader: the only .uf2 that boots on a
          # board whose Katapult is gone.
          rm -rf klipper-build/out
          cp firmware/skr-pico/klipper-standalone.config klipper-build/.config
          make -C klipper-build olddefconfig
          assert_config klipper-build/.config firmware/skr-pico/klipper-standalone.config
          make -C klipper-build -j"$(nproc)"
          cp klipper-build/out/klipper.uf2 "$FW_OUT/klipper-standalone.uf2"

          ls -lh "$FW_OUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mainsail/package-lock.json

      - name: Build Mainsail
        run: |
          cd mainsail
          npm ci
          npm run build
          mkdir -p ../stitchlabos/image/src/modules/mainsail/filesystem/home/pi/mainsail
          cp -r dist/* ../stitchlabos/image/src/modules/mainsail/filesystem/home/pi/mainsail/

      - name: Prepare TurtleStitch
        run: |
          set -euo pipefail
          # Ship a standalone repo, not a copy of the submodule: checkout leaves
          # the submodule with a .git *file* (gitdir: ../.git/modules/turtlestitch)
          # and a detached HEAD, which Moonraker's update_manager rejects on the Pi.
          # Instead: `master` on the pinned commit, tracking origin/master.
          # ORIGIN and BRANCH must match [update_manager turtlestitch] in moonraker.conf.
          SRC="$GITHUB_WORKSPACE/turtlestitch"
          DEST="$GITHUB_WORKSPACE/stitchlabos/image/src/modules/turtlestitch/filesystem/home/pi/turtlestitch"
          ORIGIN="https://github.com/prntr/turtlestitch.git"
          BRANCH="master"
          REF="$(git -C "$SRC" rev-parse HEAD)"
          git -C "$SRC" fetch --quiet origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          if ! git -C "$SRC" merge-base --is-ancestor "$REF" "origin/${BRANCH}"; then
            echo "::error::turtlestitch ${REF} is not on origin/${BRANCH}. Push the submodule commit to ${BRANCH} before building."
            exit 1
          fi
          # Full history is ~1.4 GB. Clone just deep enough to reach the pin from
          # origin/master, so the branch is visibly behind rather than diverged.
          DEPTH="$(( $(git -C "$SRC" rev-list --count "${REF}..origin/${BRANCH}") + 1 ))"
          rm -rf "$DEST"
          git init --quiet --initial-branch="$BRANCH" "$DEST"
          git -C "$DEST" fetch --quiet --no-tags --depth="$DEPTH" "file://${SRC}" \
            "+refs/remotes/origin/${BRANCH}:refs/remotes/origin/${BRANCH}"
          # -t: fetch only master later too; the other branches would pull the full history.
          git -C "$DEST" remote add -t "$BRANCH" origin "$ORIGIN"
          git -C "$DEST" checkout --quiet -B "$BRANCH" "$REF"
          git -C "$DEST" branch --quiet --set-upstream-to="origin/${BRANCH}" "$BRANCH"
          git -C "$DEST" status -sb | head -1
          echo "TURTLESTITCH_SHA=$(git -C "$DEST" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git qemu-user-static binfmt-support p7zip-full xz-utils jq \
            curl wget coreutils util-linux gawk file \
            kpartx dosfstools e2fsprogs parted zerofree zip libarchive-tools
          sudo modprobe loop
          echo "loop" | sudo tee /etc/modules-load.d/loop.conf
          sudo pip3 install gitpython --break-system-packages

      - name: Clone CustomPiOS
        run: |
          git clone --depth=1 https://github.com/guysoft/CustomPiOS.git

      - name: Download and expand Raspberry Pi OS base image
        run: |
          # CustomPiOS looks for base images in $DIST_PATH/image-{BOARD}/ directory
          mkdir -p stitchlabos/image/src/image-raspberrypiarm64
          echo "Fetching latest Raspberry Pi OS Lite arm64..."
          wget -q --show-progress \
            "https://downloads.raspberrypi.com/raspios_lite_arm64_latest" \
            -O stitchlabos/image/src/image-raspberrypiarm64/raspios_lite_arm64.img.xz
          echo "Extracting..."
          xz -d stitchlabos/image/src/image-raspberrypiarm64/raspios_lite_arm64.img.xz
          IMG="stitchlabos/image/src/image-raspberrypiarm64/raspios_lite_arm64.img"
          echo "Expanding rootfs to 6GB for package install headroom..."
          truncate -s 6G "$IMG"
          sudo parted -s "$IMG" resizepart 2 100%
          LOOP=$(sudo losetup -f --show -P "$IMG")
          sudo e2fsck -fy "${LOOP}p2"
          sudo resize2fs "${LOOP}p2"
          sudo losetup -d "$LOOP"
          echo "Recompressing (fast)..."
          xz -1 -T0 "$IMG"
          ls -lh stitchlabos/image/src/image-raspberrypiarm64/

      - name: Build image
        run: |
          set -euo pipefail
          # The image clones stitchlabos-config inside the chroot; pin it to the
          # submodule commit this checkout records, not whatever main is today.
          STITCHLABOS_CONFIG_REF="$(git -C "$GITHUB_WORKSPACE/stitchlabos-config" rev-parse HEAD)"
          echo "STITCHLABOS_CONFIG_SHA=$(git -C "$GITHUB_WORKSPACE/stitchlabos-config" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          sudo modprobe loop
          sudo \
            DIST_PATH="$GITHUB_WORKSPACE/stitchlabos/image/src" \
            CUSTOM_PI_OS_PATH="$GITHUB_WORKSPACE/CustomPiOS/src" \
            STITCHLABOS_CONFIG_REF="$STITCHLABOS_CONFIG_REF" \
            bash -x "$GITHUB_WORKSPACE/CustomPiOS/src/build"
        timeout-minutes: 90

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Compress and checksum
        run: |
          set -euo pipefail
          cd stitchlabos/image/src/workspace
          IMAGE=$(sudo ls *.img 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No .img file found" && exit 1
          fi
          NEW_NAME="${DIST_NAME}-${{ steps.version.outputs.version }}.img"
          sudo mv "$IMAGE" "$NEW_NAME"

          # Pi Imager needs the size and hash of the *uncompressed* image to
          # verify what it wrote to the card, so capture both before xz runs.
          echo "EXTRACT_SIZE=$(sudo stat -c%s "$NEW_NAME")" >> "$GITHUB_ENV"
          echo "EXTRACT_SHA256=$(sudo sha256sum "$NEW_NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

          sudo xz -9 -T0 -v "$NEW_NAME"
          sudo sha256sum "${NEW_NAME}.xz" | sudo tee "${NEW_NAME}.xz.sha256" > /dev/null

          echo "IMAGE_XZ=${NEW_NAME}.xz" >> "$GITHUB_ENV"
          echo "IMAGE_DOWNLOAD_SIZE=$(sudo stat -c%s "${NEW_NAME}.xz")" >> "$GITHUB_ENV"
          echo "IMAGE_DOWNLOAD_SHA256=$(sudo sha256sum "${NEW_NAME}.xz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Generate os_list.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          python3 - <<'PY'
          import json, os, pathlib

          tpl = pathlib.Path("stitchlabos/image/os_list.template.json").read_text()
          subs = {
              "__IMAGE_URL__":            os.environ["IMAGE_URL"],
              "__EXTRACT_SIZE__":         os.environ["EXTRACT_SIZE"],
              "__EXTRACT_SHA256__":       os.environ["EXTRACT_SHA256"],
              "__IMAGE_DOWNLOAD_SIZE__":  os.environ["IMAGE_DOWNLOAD_SIZE"],
              "__IMAGE_DOWNLOAD_SHA256__": os.environ["IMAGE_DOWNLOAD_SHA256"],
              "__RELEASE_DATE__":         os.environ["RELEASE_DATE"],
              "__TAG__":                  os.environ["RELEASE_TAG"],
          }
          for k, v in subs.items():
              assert k in tpl, f"placeholder {k} not in template"
              tpl = tpl.replace(k, v)
          assert "__" not in tpl, "unsubstituted placeholder left in os_list.json"

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"], "release-assets", "os_list.json")
          # Parse before writing: a malformed list makes Imager fail silently.
          json.loads(tpl)
          out.write_text(tpl)
          print(tpl)
          PY
        env:
          IMAGE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/${{ env.IMAGE_XZ }}
          RELEASE_DATE: ${{ steps.version.outputs.date }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}

      - name: Stage the commissioning guide for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Docs on main drift away from what a given image contains. Ship the
          # guide with the image so a user reads instructions that match the
          # release they downloaded, not a later main.
          ASSETS="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$ASSETS"
          {
            echo "# StitchLabOS ${{ steps.version.outputs.version }} — commissioning"
            echo
            echo "> This guide belongs to release ${{ steps.version.outputs.version }}"
            echo "> (built ${{ steps.version.outputs.date }}). Newer releases ship their own."
            echo
            # Relative links to sibling docs break once the file stands alone,
            # so pin them to this tag on GitHub.
            BASE="https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.version }}/docs"
            tail -n +2 docs/11-commissioning.md \
              | sed -E "s#\]\(([0-9]{2}-[a-z-]+\.md)#](${BASE}/\1#g"
          } > "$ASSETS/COMMISSIONING.md"
          if grep -qE '\]\([0-9]{2}-' "$ASSETS/COMMISSIONING.md"; then
            echo "::error::relative doc link survived in COMMISSIONING.md"
            grep -nE '\]\([0-9]{2}-' "$ASSETS/COMMISSIONING.md"
            exit 1
          fi
          wc -l "$ASSETS/COMMISSIONING.md"

      - name: Stage firmware artifacts for release
        run: |
          set -euo pipefail
          FW_OUT="stitchlabos/image/src/modules/pico-firmware/filesystem/home/pi/firmware"
          STAGE="$GITHUB_WORKSPACE/release-assets/firmware"
          mkdir -p "$STAGE"
          # The chroot build may have left these root-owned; take them back so
          # the release action can read them as the runner user.
          sudo cp "$FW_OUT"/katapult.uf2 "$FW_OUT"/klipper.bin \
                  "$FW_OUT"/klipper.uf2 "$FW_OUT"/klipper-standalone.uf2 "$STAGE/"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/release-assets"
          ( cd "$STAGE" && sha256sum ./* > SHA256SUMS.txt )
          ls -lh "$STAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DIST_NAME }}-${{ steps.version.outputs.version }}
          path: |
            stitchlabos/image/src/workspace/*.img.xz
            stitchlabos/image/src/workspace/*.img.xz.sha256
            release-assets/**
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: StitchLabOS ${{ steps.version.outputs.version }}
          body: |
            ## StitchLabOS ${{ steps.version.outputs.version }}

            ### 1. Flash the SD card

            **Recommended — StitchLabOS as a selectable OS.** Start Raspberry Pi Imager with
            this release's OS list, then pick StitchLabOS under *Choose OS*. Hostname, WiFi
            and SSH stay editable in the customisation dialog:

            ```
            rpi-imager --repo https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/os_list.json
            ```

            **Alternative — direct image.** *Choose OS → Use custom*, then select the
            `.img.xz` below. Note that Imager's customisation dialog is unavailable on this
            path; the defaults further down apply instead.

            ### 2. First boot

            - **WiFi AP**: connect to `Stitchlab` (password: `praxistest`), then open http://stitchlab.local
            - **SSH**: `ssh pi@stitchlab.local` (password: `lab`)

            ### 3. Commission the SKR Pico

            A factory-fresh SKR Pico carries no Klipper firmware, so Klipper will report no
            MCU until it is flashed once. This image ships the firmware — no dev machine and
            no internet needed:

            ```
            ssh pi@stitchlab.local
            stitchlab-flash-pico
            ```

            Hold **BOOTSEL** and plug the Pico into a USB port of the Pi when prompted. The
            script writes Katapult over USB and Klipper over `/dev/serial0`, then verifies
            that the MCU came up. Every later firmware update runs over the UART alone —
            no cable, no jumper.

            `COMMISSIONING.md` below is the full walkthrough for **this** image, including
            what to do when something sticks.

            ### Included

            - Klipper + Moonraker (master at build time, Klipper `${{ env.KLIPPER_FW_SHA }}`)
            - SKR Pico firmware, prebuilt: Katapult `${{ env.KATAPULT_FW_SHA }}` + matching Klipper
              (UART0 on GPIO0/GPIO1, 115200 baud, app at `0x10004000`)
            - Mainsail v2.17.0 + StitchLAB UI (WiFi Manager, Embroidery Panel, GCode Studio)
            - TurtleStitch offline editor with Moonraker integration (`${{ env.TURTLESTITCH_SHA }}`)
            - G-code intake: pre-flight compatibility checks and cached job thumbnails
            - WiFi Manager with AP fallback (AccessPopup); stitchlabos-config `${{ env.STITCHLABOS_CONFIG_SHA }}`
            - Live Jog controller daemon
            - KIAUH, Katapult
          files: |
            stitchlabos/image/src/workspace/*.img.xz
            stitchlabos/image/src/workspace/*.img.xz.sha256
            release-assets/os_list.json
            release-assets/COMMISSIONING.md
            release-assets/firmware/*
          draft: false
          # Deliberately never a prerelease: GitHub excludes prereleases from
          # /releases/latest/, which would leave every "latest" URL in README
          # and docs pointing at nothing while the project is in beta.
          prerelease: false
          generate_release_notes: false

      - name: Verify published URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Beta1 shipped an os_list.json pointing at an asset name that was never
          # published — a silent 404 for every user. Prove the links work before
          # anyone downloads them.
          LIST="$GITHUB_WORKSPACE/release-assets/os_list.json"
          FAILED=0

          # Release assets can take a moment to become downloadable.
          sleep 20

          # Both the tag-pinned URLs (release text) and the /latest/ URL (README,
          # docs) must work. /latest/ only resolves because prerelease is false.
          for url in \
            "$(jq -r '.os_list[0].url' "$LIST")" \
            "$(jq -r '.os_list[0].icon' "$LIST")" \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/os_list.json" \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/COMMISSIONING.md" \
            "https://github.com/${{ github.repository }}/releases/latest/download/os_list.json"
          do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "ok   $code  $url"
            else
              echo "::error::$code $url"
              FAILED=1
            fi
          done

          [ "$FAILED" = "0" ] || exit 1

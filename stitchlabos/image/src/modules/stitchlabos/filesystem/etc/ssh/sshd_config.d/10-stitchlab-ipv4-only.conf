# StitchLabOS: sshd on IPv4 only, like nginx, Moonraker and Avahi.
# The image ships a default password (pi / lab). A hotspot with an IPv6
# uplink gives the Pi a global IPv6 address (workshop 2026-10-06); sshd on
# "::" would then be the one service reachable on it, possibly from outside
# the hotspot. Remove this file only together with a changed password.
AddressFamily inet

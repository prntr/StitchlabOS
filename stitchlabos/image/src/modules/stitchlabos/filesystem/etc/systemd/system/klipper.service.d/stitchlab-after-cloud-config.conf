# StitchLabOS: start after cloud-init's config stage.
#
# Raspberry Pi Imager passes a timezone through cloud-init, which sets it in
# cloud-config.service on first boot. A service started before that keeps the
# image's old zone until it restarts: on a v0.1.0-beta.4 machine moonraker.log
# and the nginx access log ran an hour behind all day. This unit and
# cloud-config.service both wait for network-online.target already, so this
# costs only cloud-config's own runtime (about 2 s on first boot). Without
# cloud-init in the boot, After= is a no-op.
[Unit]
After=cloud-config.service

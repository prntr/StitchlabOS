# StitchLabOS — TCP keepalive tuning for Mainsail/Moonraker WebSocket.
#
# Defaults to 2 hours of idle before the kernel probes a half-open
# connection, which is far too long for client-side WiFi NICs that park
# their radio aggressively (common on Windows laptops). With
# proxy_socket_keepalive on in the nginx WebSocket block, these values
# decide how quickly half-open sockets are reaped.
#
# See P0-10 of the Cross-Platform Mainsail Stability plan.
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 4

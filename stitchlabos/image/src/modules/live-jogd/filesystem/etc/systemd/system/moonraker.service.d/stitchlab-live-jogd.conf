# StitchLabOS: keep live_jogd.service loaded so Moonraker can control it.
#
# live_jogd is deliberately not enabled (see live_jogd.service). An inactive
# unit that nothing references is not loaded, so Moonraker's service
# discovery (loaded units only) never lists it and machine.services.start
# fails with "Service 'live_jogd' not installed". Any dependency reference
# loads the unit without starting it. Before= matches the After=moonraker
# ordering live_jogd.service already declares, so it adds no cycle.
[Unit]
Before=live_jogd.service

# Upstream commits this StitchLabOS release ships (wissen D-072: pin per
# release; operator decision 2026-10-07 for beta6: the beta5 build's commits).
#
# build-image.yml builds the SKR Pico firmware from KLIPPER_REF/KATAPULT_REF
# and passes every *_REF to the image modules, which clone exactly these
# commits; moonraker.conf pins Klipper and Moonraker in the Update Manager.
# `make klipper-drift` runs our configs and sample jobs at KLIPPER_REF and at
# upstream master and lists what changed in between.
#
# Moving a pin: run `make klipper-drift`, read its report, change the commit
# here, and name the Pico re-flash (stitchlab-flash-pico --uart) in the
# release notes when KLIPPER_REF moves.
#
# Plain KEY=value lines (no secrets): sourced by bash, read by make and by
# GitHub Actions.

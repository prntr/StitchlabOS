# Klipper drift check variant "hybrid": the image printer.cfg with the values
# of the hybrid-gantry config found on stitchlabdev on 2026-10-06 (dated
# 2026-09-29: X 80 / Y 130, X direction not inverted, 9 RGBW LEDs, fan on
# gpio20). A test variant, not a machine config: who owns machine variants
# is open (wissen D-073). Later sections override the included ones.
[stepper_x]
dir_pin: gpio10
position_max: 80

[stepper_y]
position_max: 130

[stepper_z]
homing_retract_dist: 1

[tmc2209 stepper_z]
run_current: 1.1

[printer]
max_velocity: 150
max_z_velocity: 40
max_z_accel: 60

[output_pin always_on_fan]
pin: gpio20
pwm: True
value: 0.50
shutdown_value: 0
cycle_time: 0.01

[neopixel board_neopixel]
chain_count: 9
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.5

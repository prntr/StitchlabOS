# Klipper drift check: deviations from the machine config, for batch mode only.
#
# Batch mode never sees an endstop trigger, so G28 Z runs the full homing
# distance (1.5 x position_max). With the image's 5 000 000 mm that is
# billions of steps; 200 mm keeps every sample's Z (one stitch = 5 mm) in
# range and the run short.
[stepper_z]
position_max: 200

# Prints the logical position into the log, where the drift check compares it.
[gcode_macro _DRIFT_POS]
gcode:
    {% set g = printer.gcode_move %}
    { action_respond_info("DRIFT pos X=%.3f Y=%.3f Z=%.3f absolute=%s homed=%s" % (g.gcode_position.x, g.gcode_position.y, g.gcode_position.z, g.absolute_coordinates, printer.toolhead.homed_axes)) }

# A writable job folder inside the drift container.
[virtual_sdcard]
path: /tmp/drift-gcodes
